# 应用自定义命令的权限声明（与 permissions/autogenerated/ 下 Tauri 生成的同格式）。
#
# 为什么需要手写：capabilities/default.json 引用了 "allow-open-log-directory"，而 CLI 的
# 权限生成步骤没有为这个新命令产出文件，于是 build.rs 校验能力时直接 panic
# （`Permission allow-open-log-directory not found`），把发布构建和两个平台的 clippy 一起打挂。

[[permission]]
identifier = "allow-open-log-directory"
description = "Enables the open_log_directory command without any pre-configured scope."
commands.allow = ["open_log_directory"]

[[permission]]
identifier = "deny-open-log-directory"
description = "Denies the open_log_directory command without any pre-configured scope."
commands.deny = ["open_log_directory"]
