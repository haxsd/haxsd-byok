<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0e14" />
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background-color: var(--vscode-editor-background, var(--startup-background, #0b0e14));
      }
    </style>
    <script>
      (() => {
        try {
          // 预涂底色必须认识**全部**主题（src/shared/theme/theme.ts 的 themeIds）：
          // 以前只判断 default-light，其余一律当 default-dark，于是默认主题 midnight
          // 在启动瞬间被涂成 default-dark 的底色，窗口会闪一下。
          const stored = localStorage.getItem("haxsd-byok.theme");
          const known = {
            midnight: { background: "#0b0e14", scheme: "dark" },
            "default-dark": { background: "#141414", scheme: "dark" },
            "default-light": { background: "#f5f5f5", scheme: "light" },
          };
          const theme = Object.prototype.hasOwnProperty.call(known, stored ?? "") ? stored : "midnight";
          const picked = known[theme];
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.setProperty("--startup-background", picked.background);
          document.documentElement.style.colorScheme = picked.scheme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", picked.background);
        } catch {
          // The inline CSS already provides the default-theme fallback.
        }
      })();
    </script>
    <title>haxsd byok</title>
  </head>

  <body>
    <noscript>haxsd byok 需要 JavaScript 才能运行。</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
