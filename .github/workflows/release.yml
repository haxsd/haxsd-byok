name: Release haxsd byok desktop app

# 触发方式：
#   1. 打版本标签：git tag haxsd-byok-v1.0.0 && git push origin haxsd-byok-v1.0.0
#   2. 在 Actions 页面手动触发（用于验证构建是否能通过）
#
# 说明：本工作流运行在产品自己的仓库里，只构建 Windows 安装包。
# 需要 macOS / Linux 产物时，把下面 publish 任务的 matrix 补齐即可。
#
# 发布正式版本需要仓库机密 TAURI_SIGNING_PRIVATE_KEY；
# 应用内更新读取 Release 里的 latest.json，由 tauri-action 用该密钥签名产生。
on:
  push:
    tags:
      - "haxsd-byok-v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haxsd-byok-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.release.outputs.should_publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release author
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          if [[ "${GITHUB_ACTOR}" != "${REPOSITORY_OWNER}" ]]; then
            echo "Only ${REPOSITORY_OWNER} may publish a release" >&2
            exit 1
          fi

      # 版本号必须处处一致，且标签名必须是 haxsd-byok-v<版本号>；
      # 手动触发时跳过标签校验，只校验各处版本号一致。
      #
      # 除了 tauri.conf.json / package.json / src-tauri/Cargo.toml 三处源文件，两个锁
      # 文件也要一起校验：`cargo build --locked`（Dockerfile 与 release 构建都在用）会
      # 因为 Cargo.lock 停在旧版本而直接失败，package-lock.json 落后则会把旧版本写进
      # 发布产物的依赖树。
      - name: Read and verify app version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          package_version=$(node -p "require('./apps/desktop/package.json').version")
          cargo_version=$(sed -n '/^version = / { s/version = "\([^"]*\)"/\1/p; q; }' apps/desktop/src-tauri/Cargo.toml)
          package_lock_version=$(node -p "require('./apps/desktop/package-lock.json').version")
          package_lock_root_version=$(node -p "require('./apps/desktop/package-lock.json').packages[''].version")
          cargo_lock_version=$(sed -n '/^name = "haxsd-byok-desktop"$/,/^version = / { s/^version = "\([^"]*\)"/\1/p; }' Cargo.lock | head -n 1)
          test "${version}" = "${package_version}"
          test "${version}" = "${cargo_version}"
          test "${version}" = "${package_lock_version}"
          test "${version}" = "${package_lock_root_version}"
          test -n "${cargo_lock_version}"
          test "${version}" = "${cargo_lock_version}"
          if [[ "${GITHUB_REF_TYPE}" = "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "haxsd-byok-v${version}"
            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "haxsd byok release tag must point to a commit contained in main" >&2
              exit 1
            fi
          else
            echo "Manual run: skipping tag checks for version ${version}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check whether this version is already published
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          if [[ "${REF_TYPE}" != "tag" ]]; then
            echo "Manual run: building without publishing a release."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          state=$(gh release view "haxsd-byok-v${VERSION}" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || true)
          if [[ "${state}" = "published" ]]; then
            echo "Version ${VERSION} is already published; nothing to do."
            echo "should_publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "should_publish=true" >> "${GITHUB_OUTPUT}"
          fi

  publish:
    name: Publish (windows-x86_64)
    needs: prepare
    # 本地发布（桌面端已在本机构建签名）转正草稿时会创建 tag ref，同样触发本工作流；
    # 此时 prepare 已判定"该版本已发布"，整段跳过，不再白烧一次 Windows runner。
    # 手动 workflow_dispatch（ref_type=branch）的验证构建不受影响。
    if: needs.prepare.outputs.should_publish == 'true' || github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            args: "--bundles nsis"
            target: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # 打标签时由 tauri-action 直接建 Release 并上传安装包；
      # 手动触发时只产出 Actions 产物，便于先验证构建是否通过。
      # TAURI_SIGNING_PRIVATE_KEY 存在时，tauri-action 会同时签名并上传 latest.json，
      # 应用内更新据此工作：https://github.com/haxsd/haxsd-byok/releases/latest/download/latest.json
      - uses: tauri-apps/tauri-action@v1
        if: needs.prepare.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: haxsd-byok-v__VERSION__
          releaseName: haxsd byok v__VERSION__
          releaseBody: 从下方资源中下载 haxsd byok Windows 安装包（`-setup.exe`）。应用内「检查更新」会自动找到这里的最新版本。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Build without publishing (manual run)
        if: needs.prepare.outputs.should_publish != 'true'
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Upload manual build output
        if: needs.prepare.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manual-build-windows
          # Cargo builds this workspace into the workspace-level target, so the
          # bundle lands there, not under apps/desktop/src-tauri. The .sig files
          # travel with the installer because the updater verifies them.
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
          if-no-files-found: error

  finalize:
    name: Publish GitHub Release
    needs: [prepare, publish]
    if: needs.prepare.outputs.should_publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri-action writes the API asset URL into latest.json. That host answers
      # anonymously only within GitHub's 60-requests-per-hour budget, and an
      # exhausted budget turns the installer download into a 403 for every client
      # behind a shared address. The plain release download URL is not metered, so
      # the manifest is rewritten before it goes live. This runs while the release
      # is still a draft, so no client ever sees the metered URL.
      #
      # 重写走 `.github/scripts/normalize-tauri-update.mjs`（用例见
      # `normalize-tauri-update.test.mjs`，CI 的 `gates` 任务在跑）：这段逻辑原来是这里
      # 内联的 python 复制品，少了"版本与标签必须一致"和"未知资产必须拒绝"两类校验，
      # 而且没有用例。
      - name: Rewrite the manifest onto unmetered download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          tag="haxsd-byok-v${VERSION}"
          mkdir -p manifest
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --pattern latest.json --dir manifest --clobber
          # 脚本的契约是 REST 形状（snake_case 的 tag_name 与 assets[].id /
          # browser_download_url）；`gh release view --json` 给的是 camelCase。
          #
          # 不能用 `releases/tags/<tag>`：此时 release 还是草稿（tauri-action 用
          # releaseDraft=true 建的），REST 按 tag 解析会把草稿当成不存在而返回 404。
          # 草稿只出现在列表接口里，所以取最近的 release 列表再按 tag_name 过滤；列表默认
          # 每页 30 条，per_page=100 足够覆盖刚建的那条，配合下面的空结果检查不会静默通过。
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${tag}\")" > manifest/release.json
          if [ ! -s manifest/release.json ]; then
            echo "no release (draft included) found for tag ${tag}" >&2
            exit 1
          fi
          node .github/scripts/normalize-tauri-update.mjs \
            --manifest manifest/latest.json \
            --release manifest/release.json \
            --repository "${GITHUB_REPOSITORY}" \
            --tag "${tag}" \
            --version "${VERSION}"
          # Fail loudly rather than publish a manifest that still points at the
          # metered host.
          if grep -q "api.github.com" manifest/latest.json; then
            echo "latest.json still points at api.github.com" >&2
            exit 1
          fi
          gh release upload "${tag}" manifest/latest.json --repo "${GITHUB_REPOSITORY}" --clobber

      # 显式 --repo 不依赖工作树：这一步失败会让版本停在草稿状态，不能靠"gh 能从
      # checkout 推断仓库"这种隐式前提（本任务只是为了跑上面的共享脚本才 checkout）。
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "haxsd-byok-v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
