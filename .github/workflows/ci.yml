name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Manual runs let the guarded MSVC experiment below be triggered without an
  # empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The workspace includes apps/desktop/src-tauri, so even `cargo check`
      # needs the same system libraries the release workflow installs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

  linux-devin:
    name: Devin gateway (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The workspace includes apps/desktop/src-tauri, so even `cargo check`
      # needs the same system libraries the release workflow installs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The loopback isolation and Connect wire suites are the ones that must
      # hold on every platform; they run on their own so a failure points at
      # Devin rather than at an unrelated suite.
      - name: Run the Devin gateway suites
        run: |
          cargo test --test devin_gateway_isolation
          cargo test --test connect_wire
          cargo test -p cursor-server --lib devin::

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check types and production build
        working-directory: apps/desktop
        run: npm run check

  desktop-rust:
    name: Desktop Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run platform Clippy
        run: cargo clippy --package haxsd-byok-desktop --all-targets -- -D warnings

      # Windows exercises the shipped native authorization and lifecycle code.
      - name: Run the desktop unit tests on MSVC
        if: matrix.os == 'windows-latest'
        run: cargo test --package haxsd-byok-desktop --lib

  records-guard:
    name: Public repo hygiene
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 内部资料（交接说明、内部方案/审查/审计、逆向工具）属于私有记录仓库
      # haxsd/haxsd-dev-records；公开仓库里出现即失败。
      - name: 公开仓库不得包含内部资料
        run: |
          set -euo pipefail
          forbidden='^(HANDOFF\.md|BRANCH_ISOLATION\.md|docs/plans/|docs/superpowers/|docs/quality-review-|docs/devin-router-vendor-evidence\.md|support/cursor-capture/|support/cursor-protocol-extractor/)'
          tracked=$(git ls-files | grep -E "$forbidden" || true)
          if [ -n "$tracked" ]; then
            echo "::error::公开仓库出现内部资料（应放在私有记录仓库 haxsd/haxsd-dev-records）："
            echo "$tracked"
            exit 1
          fi
          history=$(git log --all --name-only --pretty=format: | sort -u | grep -E "$forbidden" || true)
          if [ -n "$history" ]; then
            echo "::error::历史里出现内部资料路径："
            echo "$history"
            exit 1
          fi
          echo "公开仓库没有内部资料 ✓"
