name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/devin-router
  # Manual runs let the guarded MSVC experiment below be triggered without an
  # empty commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The workspace includes apps/desktop/src-tauri, so even `cargo check`
      # needs the same system libraries the release workflow installs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets

  linux-devin:
    name: Devin gateway (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The workspace includes apps/desktop/src-tauri, so even `cargo check`
      # needs the same system libraries the release workflow installs.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      # The loopback isolation and Connect wire suites are the ones that must
      # hold on every platform; they run on their own so a failure points at
      # Devin rather than at an unrelated suite.
      - name: Run the Devin gateway suites
        run: |
          cargo test --test devin_gateway_isolation
          cargo test --test connect_wire
          cargo test -p cursor-server --lib devin::

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Check types and production build
        working-directory: apps/desktop
        run: npm run check

  desktop-rust:
    name: Desktop Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run platform Clippy
        run: cargo clippy --package haxsd-byok-desktop --all-targets -- -D warnings

      # The developer's Windows GNU toolchain cannot load this test binary
      # (`0xc0000139`); that was traced to the local MCF runtime rather than to
      # the code, because the same binary runs here on MSVC. This step is the
      # gate that keeps the desktop unit tests covered, and it stays skippable so
      # a red job always means a regression instead of a missing variable.
      - name: Run the desktop unit tests on MSVC
        if: matrix.os == 'windows-latest' && vars.RUN_DESKTOP_UNIT_TESTS == 'true'
        run: cargo test --package haxsd-byok-desktop --lib
